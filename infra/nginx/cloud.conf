worker_processes auto;

events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 20;
    client_body_timeout 10;
    client_max_body_size 1m;

    # 市场暴跌日会创建真实的实验数据。公网只允许全局每分钟启动一次，
    # 防止重复点击或恶意请求把 4 GB 演示机拖入持续满载。
    limit_req_zone $server_name zone=fincore_scenario_global:10m rate=1r/m;
    limit_req_zone $server_name zone=fincore_lifecycle_global:10m rate=2r/m;
    limit_req_zone $server_name zone=fincore_exchange_global:10m rate=6r/m;
    limit_req_status 429;

    upstream fincore_app {
        server app:8080;
        keepalive 16;
    }

    upstream fincore_grafana {
        server grafana:3000;
        keepalive 8;
    }

    upstream fincore_prometheus {
        server prometheus:9090;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        location = / {
            try_files /index.html =404;
        }

        location = /health {
            proxy_pass http://fincore_app/actuator/health;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store" always;
        }

        # 公网仅开放受全局限流保护的确定性实验入口；其他故障注入接口全部拒绝。
        location = /lab/scenarios/market-crash-day {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=fincore_scenario_global burst=1 nodelay;
            add_header Access-Control-Allow-Origin "https://fincore-reliability-demo.soldierking04d.chatgpt.site" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control, Pragma" always;
            add_header Vary "Origin" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_read_timeout 120s;
            proxy_pass http://fincore_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /lab/scenarios/full {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=fincore_scenario_global burst=1 nodelay;
            add_header Access-Control-Allow-Origin "https://fincore-reliability-demo.soldierking04d.chatgpt.site" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control, Pragma" always;
            add_header Vary "Origin" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_read_timeout 120s;
            proxy_pass http://fincore_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /lab/scenarios/trading-lifecycle {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=fincore_lifecycle_global burst=1 nodelay;
            add_header Access-Control-Allow-Origin "https://fincore-reliability-demo.soldierking04d.chatgpt.site" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control, Pragma" always;
            add_header Vary "Origin" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_read_timeout 60s;
            proxy_pass http://fincore_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 九域能力实验只执行确定性的进程内模型，不写资金账本；仍使用独立全局限流，
        # 防止公开演示按钮被持续调用而占用小规格服务器 CPU。
        location = /lab/scenarios/exchange-coverage {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=fincore_exchange_global burst=2 nodelay;
            add_header Access-Control-Allow-Origin "https://fincore-reliability-demo.soldierking04d.chatgpt.site" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control, Pragma" always;
            add_header Vary "Origin" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_read_timeout 30s;
            proxy_pass http://fincore_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /lab/ {
            return 403;
        }

        # API 公网访问限定为只读查询；写入和资金变更只能通过自动实验或 SSH 执行。
        location /api/ {
            limit_except GET { deny all; }
            proxy_pass http://fincore_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /actuator/ {
            limit_except GET { deny all; }
            proxy_pass http://fincore_app;
            proxy_set_header Host $host;
        }

        location /grafana/ {
            proxy_pass http://fincore_grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /prometheus/ {
            limit_except GET OPTIONS { deny all; }
            # 统一覆盖 Prometheus 自带的通配 CORS 响应，避免重复 Origin 头，
            # 并只允许展示站读取固定在前端代码中的查询。
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            add_header Access-Control-Allow-Origin "https://fincore-reliability-demo.soldierking04d.chatgpt.site" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control, Pragma" always;
            add_header Vary "Origin" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://fincore_prometheus;
            proxy_set_header Host $host;
        }
    }
}
