server:
  port: 8080
spring:
  application:
    name: fincore-reliability-lab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fincore}
    username: ${SPRING_DATASOURCE_USERNAME:fincore}
    password: ${SPRING_DATASOURCE_PASSWORD:fincore}
    hikari:
      maximum-pool-size: 20
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fincore-settlement-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: dev.fincore.*
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record
  flyway:
    enabled: true
mybatis:
  configuration:
    # 记录类型使用构造器参数名映射，避免依赖字段声明顺序。
    arg-name-based-constructor-auto-mapping: true
    # 数据库下划线命名统一映射为 Java 驼峰命名。
    map-underscore-to-camel-case: true
    # 金融事务每次查询都读取当前数据库状态，不跨语句复用一级缓存快照。
    local-cache-scope: statement
    default-statement-timeout: 30
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
fincore:
  worker:
    id: ${FINCORE_WORKER_ID:${HOSTNAME:local-worker}}
    shard-count: 8
  kafka:
    settlement-topic: settlement.commands.v1
    outbox-topic: settlement.events.v1
    matching-topic: matching.events.v1
