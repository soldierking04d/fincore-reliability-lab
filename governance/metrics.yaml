{
  "$schema": "./schemas/metric-catalog.schema.json",
  "registryVersion": "1.0",
  "registryType": "metric_catalog",
  "metrics": [
    {
      "metricId": "trade_count",
      "name": "权威成交笔数",
      "version": "v1",
      "purpose": "确认撮合形成的权威成交规模",
      "type": "business",
      "unit": "trades",
      "owner": "Matching Product Lead",
      "steward": "Matching Data Steward",
      "definition": "权威 trade 表中满足当前实验场景范围的成交记录数",
      "source": "postgresql.trade",
      "authority": "authoritative",
      "freshness": "事务提交后可见",
      "qualityRules": ["trade_id 唯一", "quantity 大于 0", "订单数量守恒"],
      "thresholds": ["场景断言按输入订单计算预期值"],
      "dimensions": ["symbol", "scenario"],
      "consumers": ["reconciliation", "scenario_report", "demo_site"],
      "demoOnly": false,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    },
    {
      "metricId": "unique_trade_sequences",
      "name": "唯一成交序列数",
      "version": "v1",
      "purpose": "证明同一交易对成交序列没有重复",
      "type": "correctness",
      "unit": "sequences",
      "owner": "Matching Engineering Lead",
      "steward": "Financial Reliability Steward",
      "definition": "按 symbol 去重后的 trade_sequence 数量，应与相同范围 trade_count 一致",
      "source": "postgresql.trade.trade_sequence",
      "authority": "authoritative",
      "freshness": "事务提交后可见",
      "qualityRules": ["symbol 与 trade_sequence 联合唯一", "必须等于成交笔数"],
      "thresholds": ["unique_trade_sequences = trade_count"],
      "dimensions": ["symbol", "scenario"],
      "consumers": ["matching_test", "scenario_report"],
      "demoOnly": false,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    },
    {
      "metricId": "duplicate_settlement_deliveries",
      "name": "结算重复投递次数",
      "version": "v1",
      "purpose": "观察至少一次投递下重复请求规模，并与唯一资金效果分开",
      "type": "reliability",
      "unit": "deliveries",
      "owner": "Settlement Engineering Lead",
      "steward": "Event Platform Steward",
      "definition": "同一结算业务键收到的总投递次数减一，不等同于重复入账次数",
      "source": "settlement_inbox_and_scenario_report",
      "authority": "derived",
      "freshness": "场景结束后",
      "qualityRules": ["business_key 非空", "与 inbox 唯一记录交叉核对"],
      "thresholds": ["允许大于 0", "重复资金效果必须为 0"],
      "dimensions": ["business_key", "scenario"],
      "consumers": ["reliability_dashboard", "scenario_report"],
      "demoOnly": false,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    },
    {
      "metricId": "ledger_transactions",
      "name": "唯一账本事务数",
      "version": "v1",
      "purpose": "确认重复投递和重试没有生成重复资金事务",
      "type": "correctness",
      "unit": "transactions",
      "owner": "Financial Control Lead",
      "steward": "Ledger Data Steward",
      "definition": "按业务键统计已提交且借贷平衡的唯一账本事务数量",
      "source": "postgresql.ledger_transaction",
      "authority": "authoritative",
      "freshness": "事务提交后可见",
      "qualityRules": ["业务键唯一", "每个事务借方总额等于贷方总额"],
      "thresholds": ["重复结算场景中唯一资金效果 = 1"],
      "dimensions": ["business_key", "asset", "scenario"],
      "consumers": ["financial_control", "scenario_report"],
      "demoOnly": false,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    },
    {
      "metricId": "reconciliation_differences",
      "name": "未收敛对账差异数",
      "version": "v1",
      "purpose": "识别权威成交与派生投影之间仍未处理的差异",
      "type": "correctness",
      "unit": "differences",
      "owner": "Financial Control Lead",
      "steward": "Reconciliation Data Steward",
      "definition": "当前批次 MISSING、MISMATCH 与未隔离 EXTRA 的数量之和",
      "source": "reconciliation_full_outer_join",
      "authority": "derived",
      "freshness": "每次对账批次结束后",
      "qualityRules": ["差异类型只能为 MISSING/MISMATCH/EXTRA", "修复后必须重新对账"],
      "thresholds": ["自动修复演示最终值 = 0", "生产阈值待 SLO 评审"],
      "dimensions": ["symbol", "difference_type", "batch"],
      "consumers": ["financial_control", "scenario_report", "demo_site"],
      "demoOnly": false,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    },
    {
      "metricId": "observed_trades_per_second",
      "name": "观测成交吞吐",
      "version": "v1",
      "purpose": "比较同一负载与资源配额下的吞吐变化，不用于单独承诺容量",
      "type": "performance",
      "unit": "trades_per_second",
      "owner": "Performance Engineering Lead",
      "steward": "Observability Steward",
      "definition": "压测观测窗口内完成的权威成交数除以窗口秒数",
      "source": "k6_and_postgresql_trade",
      "authority": "derived",
      "freshness": "压测结束后",
      "qualityRules": ["必须记录资源配额、脚本版本和窗口", "必须联合正确性断言"],
      "thresholds": ["只与同规格同脚本基线比较"],
      "dimensions": ["profile", "cpu_limit", "memory_limit", "symbol"],
      "consumers": ["capacity_review", "finops"],
      "demoOnly": false,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    },
    {
      "metricId": "api_qps",
      "name": "网站回放 API QPS",
      "version": "v1",
      "purpose": "帮助访问者理解负载、队列和资源联动，不代表实时服务器采样",
      "type": "demonstration",
      "unit": "requests_per_second",
      "owner": "Developer Experience Lead",
      "steward": "Demo Data Steward",
      "definition": "网站按固定场景时间线生成的请求速率回放值",
      "source": "website_replay_telemetry",
      "authority": "demonstration",
      "freshness": "随交互回放即时计算",
      "qualityRules": ["页面必须显示回放标签", "不得与 Prometheus 实时值合并"],
      "thresholds": ["仅用于教学曲线"],
      "dimensions": ["scenario_step"],
      "consumers": ["demo_site"],
      "demoOnly": true,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    },
    {
      "metricId": "p95_latency",
      "name": "网站回放 P95 延迟",
      "version": "v1",
      "purpose": "演示故障、队列和恢复阶段的延迟变化，不作为真实性能结果",
      "type": "demonstration",
      "unit": "milliseconds",
      "owner": "Developer Experience Lead",
      "steward": "Demo Data Steward",
      "definition": "固定演示时间线中的 P95 延迟样本",
      "source": "website_replay_telemetry",
      "authority": "demonstration",
      "freshness": "随交互回放即时计算",
      "qualityRules": ["页面必须显示演示数据", "真实结果必须链接压测证据"],
      "thresholds": ["仅用于解释趋势"],
      "dimensions": ["scenario_step"],
      "consumers": ["demo_site"],
      "demoOnly": true,
      "lastReviewed": "2026-09-01",
      "nextReview": "2026-10-01"
    }
  ]
}
