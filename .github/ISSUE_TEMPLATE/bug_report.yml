name: 缺陷报告 / Bug report
description: 报告可复现的业务、金融、工程、文档或演示问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿填写真实账户、密钥、客户数据或公司内部信息。
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 业务与产品流程
        - 金融正确性与风控
        - 架构、并发与性能
        - 可观测性与部署
        - 团队与技术治理
        - AI 用例与评测
        - 数字资产设计
        - 文档与网站演示
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 业务影响
      description: 谁会受到影响，错误结果或风险是什么？
      placeholder: 例如：重复请求后页面显示两笔结算，但账本应只有一笔资金效果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出最小步骤、输入和期望结果。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 实际结果与证据
      description: 可粘贴脱敏日志、截图、测试输出或相关链接。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: 操作系统、Java/Docker 版本、分支或提交号
  - type: checkboxes
    id: safety
    attributes:
      label: 信息安全确认
      options:
        - label: 我已确认内容不包含真实客户数据、密钥或公司机密。
          required: true
