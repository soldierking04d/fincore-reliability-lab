name: fincore-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify core model
        run: ./scripts/verify-core.sh
      - name: Validate public evaluation kit
        run: ./scripts/eval/validate-eval-kit.sh
      - name: Check release scripts
        run: |
          bash -n scripts/deploy/deploy-app-release.sh
          bash -n scripts/deploy/provision-tencent-host.sh
          if bash scripts/deploy/provision-tencent-host.sh; then
            echo "Unsafe: host provisioning must require explicit opt-in"
            exit 1
          fi
      - name: Maven tests
        run: mvn --batch-mode -Dfincore.test.require-database=true clean verify
      - name: Reject skipped or missing integration tests
        if: always()
        run: java scripts/VerifyTestReports.java
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fincore-test-evidence
          path: target/surefire-reports/
          if-no-files-found: error
      - name: Retain verified application
        uses: actions/upload-artifact@v4
        with:
          name: fincore-verified-application
          path: target/fincore-reliability-lab-*.jar
          if-no-files-found: error
