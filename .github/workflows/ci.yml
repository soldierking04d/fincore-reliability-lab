name: fincore-ci

on:
  push:
    branches: ["main", "codex/spot-funds-closure"]
  pull_request:
    branches: ["main"]

jobs:
  ai-everyday-demo:
    # 确定性演示只验证工作流合同；没有模型调用，不把模板通过率当作模型质量。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify internal requirements, tests and everyday AI examples
        run: node --test ai/company-workflow.test.ts ai/requirements-test-workflow.test.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify developer context kit and run Java red-green exercise
        run: |
          node --test ai/developer-adoption/verify-kit.test.mjs ai/developer-adoption/verify-runner.test.mjs ai/developer-adoption/prepare-task.test.mjs ai/developer-adoption/verify-candidate.test.mjs
          node ai/developer-adoption/workshop/run-workshop.mjs
      - name: Retain actual Java exercise evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-developer-workshop-evidence
          path: ${{ runner.temp }}/ai-pagination-workshop-*/report.json
          if-no-files-found: error
  java-cpp-matching:
    # 独立内存模型不连接交易数据库；正确性与 sanitizer 是门禁，耗时仅保留原始观察。
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify cross-language matching and record bounded measurements
        run: bash scripts/verify-java-cpp-matching.sh
      - name: Retain cross-language evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fincore-java-cpp-matching-evidence
          path: |
            target/java-cpp-matching/report.json
            target/java-cpp-matching/summary.json
            target/java-cpp-matching/*.txt
            target/java-cpp-matching/*.csv
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify core model
        run: ./scripts/verify-core.sh
      - name: Verify public content boundary
        run: |
          bash scripts/verify-public-content.sh --self-test
          bash scripts/verify-public-content.sh
      - name: Verify Java convention baseline
        run: ./scripts/verify-code-conventions.sh
      - name: Validate public evaluation kit
        run: ./scripts/eval/validate-eval-kit.sh
      - name: Check release scripts
        run: |
          bash -n scripts/deploy/deploy-app-release.sh
          bash -n scripts/deploy/provision-tencent-host.sh
          if bash scripts/deploy/provision-tencent-host.sh; then
            echo "Unsafe: host provisioning must require explicit opt-in"
            exit 1
          fi
      - name: Maven tests
        # Wrapper 固定 Maven；脚本同时拒绝 P3C 返回 0 但控制台出现内部处理错误的假通过。
        run: ./scripts/run-maven-verify.sh -Dfincore.test.require-database=true clean verify
      - name: Reject skipped or missing integration tests
        if: always()
        run: java scripts/VerifyTestReports.java
      - name: Retain Java convention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fincore-java-convention-evidence
          path: |
            target/pmd.xml
            target/site/pmd.html
            target/spotbugsXml.xml
            target/site/jacoco/
            target/maven-verify.log
          if-no-files-found: warn
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fincore-test-evidence
          path: target/surefire-reports/
          if-no-files-found: error
      - name: Retain verified application
        uses: actions/upload-artifact@v4
        with:
          name: fincore-verified-application
          path: target/fincore-reliability-lab-*.jar
          if-no-files-found: error
      - name: Retain isolated load and recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: fincore-runtime-evidence
          path: target/runtime-evidence/*.json
          if-no-files-found: error
