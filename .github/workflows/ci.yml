name: fincore-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify core model
        run: ./scripts/verify-core.sh
      - name: Validate public evaluation kit
        run: ./scripts/eval/validate-eval-kit.sh
      - name: Maven tests
        run: mvn --batch-mode verify
